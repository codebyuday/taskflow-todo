<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautifully designed to-do list app to organize your tasks efficiently.">
    <title>TaskFlow — Elegant To-Do Lists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header" id="app-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="2" width="24" height="24" rx="7" stroke="url(#logo-grad)" stroke-width="2.5"/>
                        <path d="M9 14.5L12.5 18L19 10" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="2" y1="2" x2="26" y2="26">
                                <stop stop-color="#a78bfa"/>
                                <stop offset="1" stop-color="#6366f1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>TaskFlow</h1>
            </div>
            <div class="header-stats">
                <div class="stat" id="stat-total">
                    <span class="stat-number">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat" id="stat-active">
                    <span class="stat-number">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat" id="stat-done">
                    <span class="stat-number">0</span>
                    <span class="stat-label">Done</span>
                </div>
            </div>
        </header>

        <!-- Add Task Section -->
        <section class="add-task-section" id="add-task-section">
            <form class="add-task-form" id="add-task-form">
                <div class="input-wrapper">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
                        <path d="M10 6.5V13.5M6.5 10H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input
                        type="text"
                        id="task-input"
                        class="task-input"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        maxlength="200"
                    >
                </div>
                <div class="form-actions">
                    <div class="priority-selector" id="priority-selector">
                        <button type="button" class="priority-btn active" data-priority="low" id="priority-low" title="Low priority">
                            <span class="priority-dot"></span> Low
                        </button>
                        <button type="button" class="priority-btn" data-priority="medium" id="priority-medium" title="Medium priority">
                            <span class="priority-dot"></span> Med
                        </button>
                        <button type="button" class="priority-btn" data-priority="high" id="priority-high" title="High priority">
                            <span class="priority-dot"></span> High
                        </button>
                    </div>
                    <button type="submit" class="add-btn" id="add-btn">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 3.75V14.25M3.75 9H14.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter Tabs -->
        <nav class="filter-tabs" id="filter-tabs">
            <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
            <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
            <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
        </nav>

        <!-- Task List -->
        <main class="task-list-container" id="task-list-container">
            <ul class="task-list" id="task-list">
                <!-- Tasks inserted dynamically -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <rect x="12" y="8" width="40" height="48" rx="8" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                        <path d="M22 24H42M22 32H36M22 40H30" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
                        <circle cx="48" cy="48" r="12" fill="url(#empty-grad)" opacity="0.15"/>
                        <path d="M44 48H52M48 44V52" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                        <defs>
                            <linearGradient id="empty-grad" x1="36" y1="36" x2="60" y2="60">
                                <stop stop-color="#a78bfa"/>
                                <stop offset="1" stop-color="#6366f1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h2 class="empty-title">No tasks yet</h2>
                <p class="empty-subtitle">Add your first task above to get started</p>
            </div>
        </main>

        <!-- Footer Actions -->
        <footer class="app-footer" id="app-footer">
            <button class="footer-btn" id="clear-completed-btn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 4H14M5.333 4V2.667A1.333 1.333 0 016.667 1.333h2.666A1.333 1.333 0 0110.667 2.667V4M12.667 4V13.333A1.333 1.333 0 0111.333 14.667H4.667A1.333 1.333 0 013.333 13.333V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Clear Completed
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
